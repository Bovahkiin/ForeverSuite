
name: Discord Release Announcement

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discord-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

    steps:
      - name: Send Discord Release Announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PING_EVERYONE: "true"

        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          webhook = os.environ["DISCORD_WEBHOOK_URL"]
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]

          if not webhook:
              raise SystemExit("Discord webhook secret is missing!")

          event = json.loads(
              Path(os.environ["GITHUB_EVENT_PATH"]).read_text()
          )

          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              print("Fetching latest GitHub release...")

              api_url = (
                  f"https://api.github.com/repos/{repo}/releases/latest"
              )

              api_request = urllib.request.Request(
                  api_url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "GitHub-Release-Notifier"
                  }
              )

              with urllib.request.urlopen(
                  api_request, timeout=30
              ) as response:
                  release = json.load(response)

          else:
              release = event["release"]

          version = release["tag_name"]
          name = release.get("name") or version
          url = release["html_url"]

          changelog = (
              release.get("body") or
              "No changelog available."
          ).strip()

          if len(changelog) > 3500:
              changelog = (
                  changelog[:3500] +
                  f"\n\n[View full changelog]({url})"
              )

          assets = release.get("assets", [])

          asset = next(
              (
                  a for a in assets
                  if a["name"].lower().endswith(".zip")
              ),
              assets[0] if assets else None
          )

          if asset:
              download = (
                  f"[{asset['name'][:150]}]"
                  f"({asset['browser_download_url']})"
              )
          else:
              download = f"[View release downloads]({url})"

          ping = (
              os.environ.get("PING_EVERYONE", "false")
              .lower() == "true"
          )

          embed = {
              "title": f"🚀 {name}"[:256],
              "url": url,
              "description": changelog,
              "color": 5793266,
              "fields": [
                  {
                      "name": "📦 Version",
                      "value": version[:1024],
                      "inline": True
                  },
                  {
                      "name": "📥 Download",
                      "value": download[:1024],
                      "inline": True
                  }
              ],
              "footer": {
                  "text": f"{repo} | GitHub Release"[:200]
              }
          }

          if release.get("published_at"):
              embed["timestamp"] = release["published_at"]

          payload = {
              "username": "ForeverSuite Releases",
              "content": "@everyone" if ping else "",
              "allowed_mentions": {
                  "parse": ["everyone"] if ping else []
              },
              "embeds": [embed]
          }

          data = json.dumps(payload).encode("utf-8")

          discord_request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Release-Notifier"
              },
              method="POST"
          )

          with urllib.request.urlopen(
              discord_request, timeout=30
          ) as response:
              print("Discord status:", response.status)

          print("Release announcement sent successfully!")
          PY
