
name: Discord Release Announcement

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discord-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

    steps:
      - name: Send Discord Release Announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PING_EVERYONE: "true"

        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          webhook = os.environ["DISCORD_WEBHOOK_URL"]
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]

          if not webhook:
              raise SystemExit("Discord webhook secret is missing!")

          event = json.loads(
              Path(os.environ["GITHUB_EVENT_PATH"]).read_text()
          )

          # Fetch latest release for manual workflow runs
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              print("Fetching latest GitHub release...")

              api_url = (
                  f"https://api.github.com/repos/{repo}/releases/latest"
              )

              api_request = urllib.request.Request(
                  api_url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "ForeverSuite-Release-Bot"
                  }
              )

              with urllib.request.urlopen(
                  api_request, timeout=30
              ) as response:
                  release = json.load(response)

          else:
              release = event["release"]

          # Release information
          version = release["tag_name"]
          name = release.get("name") or version
          url = release["html_url"]

          changelog = (
              release.get("body") or
              "No changelog available."
          ).strip()

          # Automatically remove duplicate release titles
          def normalize_heading(text):
              text = text.strip()
              text = text.lstrip("#").strip()
              text = text.strip("*_").strip()
              text = re.sub(r"\s+", " ", text)
              return text.casefold()

          project = repo.split("/")[-1]

          expected_titles = {
              normalize_heading(name),
              normalize_heading(version),
              normalize_heading(f"{project} {version}"),
              normalize_heading(
                  f"{project} {version.lstrip('vV')}"
              )
          }

          lines = changelog.splitlines()

          if lines:
              first_line = normalize_heading(lines[0])

              if first_line in expected_titles:
                  changelog = "\n".join(lines[1:]).strip()
                  print("Duplicate release title removed.")

          if not changelog:
              changelog = "No changelog available."

          # Limit description to Discord embed limits
          if len(changelog) > 3500:
              changelog = (
                  changelog[:3500] +
                  f"\n\n[View full changelog]({url})"
              )

          # Find release ZIP download
          assets = release.get("assets", [])

          asset = next(
              (
                  a for a in assets
                  if a["name"].lower().endswith(".zip")
              ),
              assets[0] if assets else None
          )

          if asset:
              download = (
                  f"[{asset['name'][:150]}]"
                  f"({asset['browser_download_url']})"
              )
          else:
              download = f"[View release downloads]({url})"

          # Optional everyone notification
          ping = (
              os.environ.get("PING_EVERYONE", "false")
              .lower() == "true"
          )

          # Build Discord embed
          embed = {
              "title": f"🚀 {name}"[:256],
              "url": url,
              "description": changelog,
              "color": 5793266,
              "fields": [
                  {
                      "name": "📦 Version",
                      "value": version[:1024],
                      "inline": True
                  },
                  {
                      "name": "📥 Download",
                      "value": download[:1024],
                      "inline": True
                  }
              ],
              "footer": {
                  "text": f"{repo} | GitHub Release"[:200]
              }
          }

          if release.get("published_at"):
              embed["timestamp"] = release["published_at"]

          # Discord webhook payload
          payload = {
              "username": "ForeverSuite Releases",
              "content": "@everyone" if ping else "",
              "allowed_mentions": {
                  "parse": ["everyone"] if ping else []
              },
              "embeds": [embed]
          }

          data = json.dumps(payload).encode("utf-8")

          discord_request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "ForeverSuite-Release-Bot"
              },
              method="POST"
          )

          # Send announcement
          with urllib.request.urlopen(
              discord_request, timeout=30
          ) as response:
              print("Discord status:", response.status)

          print("ForeverSuite release announcement sent!")
          PY
