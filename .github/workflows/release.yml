name: Build ForeverSuite Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immediately after the checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: forever-suite-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and build release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r work/requirements-ci.txt
      - name: Validate version and release configuration
        run: |
          python work/build_github_release.py --check
          python work/check_release_pipeline.py
      - name: Run addon checks
        run: python -u work/check_vendor.py
      - name: Package the addon
        id: package
        run: python work/build_github_release.py
      - name: Create the release with the ZIP and patch notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ steps.package.outputs.tag }}
          ZIP: ${{ steps.package.outputs.zip }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          NOTES: ${{ steps.package.outputs.notes }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release or draft already exists for $TAG. Open it under Releases or use a new version number."
            exit 1
          fi
          release_args=(--target "$GITHUB_SHA" --title "ForeverSuite $VERSION" --notes-file "$NOTES")
          if [ "$PUBLISH" != "true" ]; then release_args+=(--draft); fi
          gh release create "$TAG" "$ZIP" "$CHECKSUM" "${release_args[@]}" > "$RUNNER_TEMP/release-url.txt"
          if [ "$PUBLISH" = "true" ]; then
            echo "### Release published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Draft release ready" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$RUNNER_TEMP/release-url.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH" != "true" ]; then
            echo "Review the ZIP and patch notes under Releases. Click Publish release when the update is ready." >> "$GITHUB_STEP_SUMMARY"
          fi
