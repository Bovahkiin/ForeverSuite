name: ForeverSuite checks

# Runs the same offline checks as the release build, but on every push and
# pull request, so a broken change shows up before release day.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Offline addon checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r work/requirements-ci.txt
      - name: Validate version and release configuration
        run: |
          python work/build_github_release.py --check
          python work/check_release_pipeline.py
      - name: Run addon checks
        run: python -u work/check_vendor.py
